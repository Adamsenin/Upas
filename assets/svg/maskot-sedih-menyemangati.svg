<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Maskot Si Kupas Menyemangati dengan Ramah">
  <!-- Tubuh Bulat Hangat & Ramah -->
  <circle cx="80" cy="88" r="54" fill="#22C55E" stroke="#0F172A" stroke-width="5" />
  <!-- Perut Kuning Lembut -->
  <ellipse cx="80" cy="103" rx="35" ry="28" fill="#FEF08A" />
  <!-- Mata Kiri Simpatik Berbinar -->
  <ellipse cx="62" cy="78" rx="13" ry="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
  <circle cx="64" cy="79" r="7" fill="#0F172A" />
  <circle cx="66" cy="76" r="3" fill="#FFFFFF" />
  <!-- Mata Kanan Simpatik Berbinar -->
  <ellipse cx="98" cy="78" rx="13" ry="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
  <circle cx="96" cy="79" r="7" fill="#0F172A" />
  <circle cx="98" cy="76" r="3" fill="#FFFFFF" />
  <!-- Alis Simpatik (Sedih-Menyemangati, Tidak Menghakimi) -->
  <path d="M48,66 Q60,58 72,64" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <path d="M112,66 Q100,58 88,64" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <!-- Tetes Keringat Kecil Ceria (Tetap Berusaha!) -->
  <path d="M122,52 C122,52 128,60 128,64 A4,4 0 1,1 120,64 C120,60 122,52 122,52 Z" fill="#38BDF8" stroke="#0F172A" stroke-width="2.5" />
  <!-- Pipi Merona Hangat -->
  <circle cx="46" cy="94" r="8" fill="#F43F5E" opacity="0.6" />
  <circle cx="114" cy="94" r="8" fill="#F43F5E" opacity="0.6" />
  <!-- Paruh Oranye -->
  <polygon points="80,84 73,93 87,93" fill="#F97316" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <!-- Senyum Lembut Menyemangati -->
  <path d="M70,99 Q80,106 90,99" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
  <!-- Daun di Kepala -->
  <path d="M80,28 C65,18 70,40 80,40 C90,40 95,18 80,28 Z" fill="#4ADE80" stroke="#0F172A" stroke-width="4" />
  <!-- Sayap Memberi Semangat -->
  <path d="M26,88 Q12,78 24,64 Q36,74 32,92 Z" fill="#16A34A" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
  <path d="M134,82 Q152,66 138,54 Q124,66 130,86 Z" fill="#16A34A" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
  <!-- Simbol Hati Kecil Penyemangat -->
  <path d="M138,36 C134,30 126,34 130,42 L138,50 L146,42 C150,34 142,30 138,36 Z" fill="#FB7185" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
</svg>

