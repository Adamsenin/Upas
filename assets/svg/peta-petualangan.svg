<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="auto" role="img" aria-label="Peta Petualangan Ekosistem Kelas">
  <defs>
    <!-- Gradien Langit -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="petaShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Latar Alam -->
  <rect width="900" height="360" fill="url(#skyGrad)"/>

  <!-- Zona 1: Hutan Tropis (Hijau Tua) -->
  <path d="M0,220 Q120,180 240,240 L240,360 L0,360 Z" fill="#15803D"/>
  <circle cx="60" cy="180" r="35" fill="#16A34A"/>
  <circle cx="100" cy="170" r="45" fill="#22C55E"/>
  <circle cx="160" cy="190" r="40" fill="#15803D"/>
  <!-- Batang Pohon -->
  <rect x="95" y="210" width="12" height="40" fill="#78350F"/>

  <!-- Zona 2: Sawah Berundak (Kuning Kehijauan) -->
  <path d="M240,240 Q360,200 480,250 L480,360 L240,360 Z" fill="#84CC16"/>
  <path d="M260,260 Q360,230 460,270" stroke="#4D7C0F" stroke-width="6" fill="none"/>
  <path d="M280,290 Q370,265 470,300" stroke="#4D7C0F" stroke-width="6" fill="none"/>

  <!-- Zona 3: Sungai Jernih (Biru Cerah) -->
  <path d="M480,250 Q580,210 680,260 L680,360 L480,360 Z" fill="#0284C7"/>
  <path d="M480,260 C530,280 620,270 680,300" stroke="#38BDF8" stroke-width="12" fill="none"/>
  <circle cx="560" cy="240" r="15" fill="#E0F2FE"/>

  <!-- Zona 4: Pesisir & Laut Lepas (Biru Laut & Pasir) -->
  <path d="M680,260 Q790,220 900,240 L900,360 L680,360 Z" fill="#0369A1"/>
  <path d="M680,260 Q760,270 820,360" fill="#FDE047"/>

  <!-- Jalur Petualangan Bertitik (Jalan Setapak) -->
  <path id="jalur-petualangan" d="M 80,260 Q 220,180 340,230 T 560,220 T 740,210 T 840,220" 
        fill="none" stroke="#FEF08A" stroke-width="14" stroke-dasharray="8 8" stroke-linecap="round"/>

  <!-- Titik Pos (Waypoints) -->
  <!-- Pos 1: Awal Hutan -->
  <g transform="translate(80, 260)">
    <circle r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
    <circle r="8" fill="#16A34A"/>
    <text y="35" text-anchor="middle" font-weight="900" font-size="14" fill="#0F172A">Mulai</text>
  </g>

  <!-- Pos 2: Sawah -->
  <g transform="translate(340, 230)">
    <circle r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
    <circle r="8" fill="#EAB308"/>
    <text y="35" text-anchor="middle" font-weight="900" font-size="14" fill="#0F172A">Sawah</text>
  </g>

  <!-- Pos 3: Sungai -->
  <g transform="translate(560, 220)">
    <circle r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
    <circle r="8" fill="#0284C7"/>
    <text y="35" text-anchor="middle" font-weight="900" font-size="14" fill="#0F172A">Sungai</text>
  </g>

  <!-- Pos 4: Garis Akhir Laut -->
  <g transform="translate(840, 220)">
    <circle r="22" fill="#FEF08A" stroke="#0F172A" stroke-width="4"/>
    <!-- Bendera Finis -->
    <path d="M -5,-12 L 12,-6 L -5,0 Z" fill="#DC2626"/>
    <line x1="-5" y1="-14" x2="-5" y2="12" stroke="#0F172A" stroke-width="3"/>
    <text y="40" text-anchor="middle" font-weight="900" font-size="14" fill="#0F172A">Puncak</text>
  </g>
</svg>
