<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Maskot Si Kupas Senang">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Tubuh Bulat Ceria -->
  <circle cx="80" cy="85" r="55" fill="#22C55E" stroke="#15803D" stroke-width="6" />
  <!-- Perut Kuning Cerah -->
  <ellipse cx="80" cy="100" rx="35" ry="30" fill="#FEF08A" />
  <!-- Mata Kiri -->
  <ellipse cx="62" cy="75" rx="14" ry="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
  <circle cx="65" cy="75" r="7" fill="#0F172A" />
  <circle cx="67" cy="72" r="2.5" fill="#FFFFFF" />
  <!-- Mata Kanan -->
  <ellipse cx="98" cy="75" rx="14" ry="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
  <circle cx="95" cy="75" r="7" fill="#0F172A" />
  <circle cx="97" cy="72" r="2.5" fill="#FFFFFF" />
  <!-- Pipi Merona -->
  <circle cx="48" cy="92" r="8" fill="#F43F5E" opacity="0.6" />
  <circle cx="112" cy="92" r="8" fill="#F43F5E" opacity="0.6" />
  <!-- Paruh Oranye Ceria -->
  <polygon points="80,82 72,92 88,92" fill="#F97316" stroke="#C2410C" stroke-width="3" stroke-linejoin="round" />
  <!-- Senyum -->
  <path d="M72,96 Q80,105 88,96" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
  <!-- Daun di Kepala -->
  <path d="M80,30 C65,18 70,42 80,42 C90,42 95,18 80,30 Z" fill="#4ADE80" stroke="#15803D" stroke-width="4" />
  <!-- Sayap Melambai -->
  <path d="M26,85 Q10,75 22,60 Q34,70 30,90 Z" fill="#16A34A" stroke="#15803D" stroke-width="4" stroke-linejoin="round" />
  <path d="M134,85 Q150,95 138,110 Q126,100 130,80 Z" fill="#16A34A" stroke="#15803D" stroke-width="4" stroke-linejoin="round" />
</svg>
