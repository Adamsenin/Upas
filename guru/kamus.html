<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kelola Kamus Belajar - Guru KUPAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/tema.css">
  <link rel="stylesheet" href="../assets/css/animasi.css">
  <link rel="stylesheet" href="../assets/css/komponen.css">
  <link rel="stylesheet" href="../assets/css/latar-hidup.css">
</head>
<body class="motion-full" data-latar-tema="tenang">
  <header id="wadah-navbar"></header>

  <main class="container py-4">
    <!-- Header Halaman -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 latar-pita-baca py-2 px-3">
      <div>
        <a href="dasbor.html" class="text-decoration-none fw-bold text-secondary mb-1 d-inline-block">
          ← Kembali ke Dasbor Guru
        </a>
        <h1 class="h2 fw-bolder mb-0">Kelola Kamus Belajar IPAS</h1>
        <p class="text-secondary small mb-0">Tambah dan kelola istilah materi untuk persiapan belajar siswa.</p>
      </div>
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <button id="btn-template-kamus" type="button" class="btn btn-kupas-putih px-3 py-2 smartboard-btn d-inline-flex align-items-center gap-1" title="Unduh format template CSV kamus">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Template CSV Kamus</span>
        </button>
        <button id="btn-impor-kamus" type="button" class="btn btn-kupas-kuning px-3 py-2 smartboard-btn fw-bold d-inline-flex align-items-center gap-1" title="Impor data istilah dari file CSV atau Excel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Impor Kamus (CSV / Excel)</span>
        </button>
        <input type="file" id="input-impor-kamus" accept=".csv, .txt, .xlsx, .xls" class="d-none">
        <button id="btn-tambah-kamus" class="btn btn-kupas-hijau px-4 py-2 smartboard-btn d-inline-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#modalKamus">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>+ Tambah Entri Kamus</span>
        </button>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="kupas-card mb-4 anim-slide-up">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white border-2 border-dark">🔍</span>
            <input type="search" class="form-control border-2 border-dark" id="cari-kamus-guru" placeholder="Cari istilah dalam kamus..." autocomplete="off">
          </div>
        </div>
        <div class="col-12 col-md-4">
          <select class="form-select border-2 border-dark fw-bold" id="filter-kategori-guru">
            <option value="semua" selected>Semua Kategori</option>
            <option value="Rantai Makanan">Rantai Makanan</option>
            <option value="Ekosistem">Ekosistem</option>
            <option value="Saling Bergantung">Saling Bergantung</option>
            <option value="Dampak Lingkungan">Dampak Lingkungan</option>
          </select>
        </div>
        <div class="col-12 col-md-2 text-md-end">
          <span class="badge bg-dark fs-6 rounded-pill px-3 py-2 text-white" id="hitung-entri-guru">0 Entri</span>
        </div>
      </div>
    </div>

    <!-- Tabel Daftar Entri Kamus -->
    <div class="kupas-card p-2 p-md-0 overflow-hidden anim-slide-up">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 table-mobile-cards">
          <thead class="table-light border-bottom border-2 border-dark">
            <tr>
              <th scope="col" style="width: 200px;">Istilah</th>
              <th scope="col" style="width: 160px;">Kategori</th>
              <th scope="col">Definisi & Contoh</th>
              <th scope="col" style="width: 100px;">Status</th>
              <th scope="col" style="width: 140px;" class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-kamus-body">
            <!-- Data entri dirender dinamis -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Tambah / Ubah Entri Kamus -->
  <div class="modal fade" id="modalKamus" tabindex="-1" aria-labelledby="modalKamusLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content kupas-card border-3 border-dark">
        <div class="modal-header border-bottom-0 pb-0">
          <h2 class="modal-title h5 fw-bolder" id="modalKamusLabel">Tambah Entri Kamus Baru</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body py-3">
          <form id="form-entri-kamus" novalidate>
            <input type="hidden" id="entri-id">
            
            <div class="mb-3">
              <label for="entri-istilah" class="form-label fw-bold">Istilah / Konsep IPAS</label>
              <input type="text" class="form-control border-2 border-dark" id="entri-istilah" placeholder="Contoh: Produsen, Fotosintesis" required>
            </div>

            <div class="mb-3">
              <label for="entri-kategori" class="form-label fw-bold">Kategori Materi</label>
              <input type="text" class="form-control border-2 border-dark" id="entri-kategori" list="list-kategori-auto" placeholder="Rantai Makanan, Ekosistem, dll" required>
              <datalist id="list-kategori-auto">
                <option value="Rantai Makanan"></option>
                <option value="Ekosistem"></option>
                <option value="Saling Bergantung"></option>
                <option value="Dampak Lingkungan"></option>
              </datalist>
            </div>

            <div class="mb-3">
              <label for="entri-definisi" class="form-label fw-bold">Definisi Penjelasan</label>
              <textarea class="form-control border-2 border-dark" id="entri-definisi" rows="3" placeholder="Tuliskan pengertian yang mudah dipahami siswa kelas V..." required></textarea>
            </div>

            <div class="mb-3">
              <label for="entri-contoh" class="form-label fw-bold">Contoh Nyata</label>
              <textarea class="form-control border-2 border-dark" id="entri-contoh" rows="2" placeholder="Contoh: Padi di sawah, pohon mangga di kebun..."></textarea>
            </div>

            <div class="mb-3">
              <label for="entri-status" class="form-label fw-bold">Status Publikasi</label>
              <select class="form-select border-2 border-dark" id="entri-status">
                <option value="terbit" selected>Terbit (Dapat dibaca siswa)</option>
                <option value="draf">Draf (Hanya guru)</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top-0 pt-0">
          <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-kupas-hijau fw-bold px-4 smartboard-btn" id="btn-simpan-entri">
            Simpan Entri
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="../assets/js/latar-hidup.js"></script>

  <script type="module">
    import { kamusManager, parseCSVKeObjekKamus } from '../assets/js/kamus.js?v=4.0.3';
    import { auth } from '../assets/js/auth.js';
    import { pasangHeader, umumkanAria, suara } from '../assets/js/ui.js';
    import { animasi } from '../assets/js/animasi.js';

    pasangHeader('guru', { berandaLink: '../index.html', rootAset: '../' });

    let daftarKamus = [];
    const tbody = document.getElementById('tabel-kamus-body');
    const inputCari = document.getElementById('cari-kamus-guru');
    const selectKategori = document.getElementById('filter-kategori-guru');
    const modalEl = document.getElementById('modalKamus');
    const modalBS = new bootstrap.Modal(modalEl);

    async function muatKamus() {
      try {
        daftarKamus = await kamusManager.ambilSemuaKamus({ hanyaTerbit: false });
        renderTabel();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger p-3">Gagal memuat kamus: ${err.message}</td></tr>`;
      }
    }

    function renderTabel() {
      const q = inputCari.value.trim().toLowerCase();
      const kat = selectKategori.value;

      const terfilter = daftarKamus.filter(k => {
        const cocokKat = (kat === 'semua' || k.kategori.toLowerCase() === kat.toLowerCase());
        const cocokCari = !q || k.istilah.toLowerCase().includes(q) || k.definisi.toLowerCase().includes(q);
        return cocokKat && cocokCari;
      });

      document.getElementById('hitung-entri-guru').textContent = `${terfilter.length} Entri`;
      tbody.innerHTML = '';

      if (terfilter.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-secondary">Belum ada entri kamus yang cocok.</td></tr>`;
        return;
      }

      terfilter.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'anim-slide-up';

        // Istilah
        const tdIstilah = document.createElement('td');
        tdIstilah.setAttribute('data-label', 'Istilah');
        tdIstilah.className = 'fw-bolder fs-6 text-dark';
        tdIstilah.textContent = item.istilah;

        // Kategori
        const tdKat = document.createElement('td');
        tdKat.setAttribute('data-label', 'Kategori');
        const spanKat = document.createElement('span');
        spanKat.className = 'badge bg-warning text-dark border border-dark rounded-pill px-2 py-1';
        spanKat.textContent = item.kategori;
        tdKat.appendChild(spanKat);

        // Definisi & Contoh
        const tdDef = document.createElement('td');
        tdDef.setAttribute('data-label', 'Definisi');
        const divDefWrap = document.createElement('div');
        const pDef = document.createElement('p');
        pDef.className = 'mb-1 text-dark small';
        pDef.textContent = item.definisi;
        divDefWrap.appendChild(pDef);
        if (item.contoh) {
          const smallContoh = document.createElement('small');
          smallContoh.className = 'text-secondary d-block fst-italic';
          smallContoh.textContent = `Contoh: ${item.contoh}`;
          divDefWrap.appendChild(smallContoh);
        }
        tdDef.appendChild(divDefWrap);

        // Status
        const tdStatus = document.createElement('td');
        tdStatus.setAttribute('data-label', 'Status');
        const spanStatus = document.createElement('span');
        spanStatus.className = `badge ${item.status === 'terbit' ? 'bg-success' : 'bg-secondary'} border border-dark rounded-pill`;
        spanStatus.textContent = item.status === 'terbit' ? 'Terbit' : 'Draf';
        tdStatus.appendChild(spanStatus);

        // Aksi
        const tdAksi = document.createElement('td');
        tdAksi.setAttribute('data-label', 'Aksi');
        tdAksi.className = 'text-md-center';
        const divBtn = document.createElement('div');
        divBtn.className = 'btn-group';

        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn btn-outline-dark btn-sm fw-bold';
        btnEdit.textContent = 'Ubah';
        btnEdit.onclick = () => bukaFormEdit(item);

        const btnHapus = document.createElement('button');
        btnHapus.className = 'btn btn-outline-danger btn-sm fw-bold';
        btnHapus.textContent = 'Hapus';
        btnHapus.onclick = () => hapusEntri(item);

        divBtn.appendChild(btnEdit);
        divBtn.appendChild(btnHapus);
        tdAksi.appendChild(divBtn);

        tr.appendChild(tdIstilah);
        tr.appendChild(tdKat);
        tr.appendChild(tdDef);
        tr.appendChild(tdStatus);
        tr.appendChild(tdAksi);
        tbody.appendChild(tr);
      });
    }

    inputCari.addEventListener('input', renderTabel);
    selectKategori.addEventListener('change', renderTabel);

    function bukaFormEdit(item) {
      document.getElementById('modalKamusLabel').textContent = 'Ubah Entri Kamus';
      document.getElementById('entri-id').value = item.id;
      document.getElementById('entri-istilah').value = item.istilah;
      document.getElementById('entri-kategori').value = item.kategori;
      document.getElementById('entri-definisi').value = item.definisi;
      document.getElementById('entri-contoh').value = item.contoh || '';
      document.getElementById('entri-status').value = item.status || 'terbit';
      modalBS.show();
    }

    document.getElementById('btn-tambah-kamus').addEventListener('click', () => {
      document.getElementById('modalKamusLabel').textContent = 'Tambah Entri Kamus Baru';
      document.getElementById('form-entri-kamus').reset();
      document.getElementById('entri-id').value = '';
    });

    // Simpan entri
    document.getElementById('btn-simpan-entri').addEventListener('click', async () => {
      const id = document.getElementById('entri-id').value;
      const istilah = document.getElementById('entri-istilah').value.trim();
      const kategori = document.getElementById('entri-kategori').value.trim();
      const definisi = document.getElementById('entri-definisi').value.trim();
      const contoh = document.getElementById('entri-contoh').value.trim();
      const status = document.getElementById('entri-status').value;

      if (!istilah || !kategori || !definisi) {
        alert('Istilah, kategori, dan definisi wajib diisi!');
        return;
      }

      const btn = document.getElementById('btn-simpan-entri');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      try {
        const user = await auth.ambilGuruAktif();
        await kamusManager.simpanKamus({
          id: id || undefined,
          guru_id: user?.id || 'guru-demo-1',
          istilah,
          kategori,
          definisi,
          contoh,
          status
        });

        modalBS.hide();
        suara.mainkan('benar');
        umumkanAria('Entri kamus berhasil disimpan!');
        await muatKamus();
      } catch (err) {
        alert('Gagal menyimpan entri: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan Entri';
      }
    });

    // Hapus entri dengan dialog konfirmasi (Fitur 4)
    async function hapusEntri(item) {
      if (confirm(`Yakin ingin menghapus istilah "${item.istilah}" dari Kamus Belajar?`)) {
        try {
          await kamusManager.hapusKamus(item.id);
          suara.mainkan('klik');
          umumkanAria(`Istilah ${item.istilah} berhasil dihapus.`);
          await muatKamus();
        } catch (err) {
          alert('Gagal menghapus entri: ' + err.message);
        }
      }
    }

    // ========================================================================
    // TAHAP 2: UNDUH TEMPLATE & IMPOR MASSAL KAMUS (CSV / EXCEL)
    // ========================================================================
    document.getElementById('btn-template-kamus')?.addEventListener('click', () => {
      const templateContent = [
        'istilah,kategori,definisi,contoh,status',
        '"Produsen","Rantai Makanan","Makhluk hidup autotrof yang dapat menghasilkan makanannya sendiri melalui proses fotosintesis.","Padi, rumput, fitoplankton","terbit"',
        '"Konsumen I","Rantai Makanan","Hewan pemakan tumbuhan (herbivora) yang memperoleh energi langsung dari produsen.","Belalang, kelinci, ulat","terbit"',
        '"Konsumen II","Rantai Makanan","Hewan karnivora atau omnivora yang memangsa konsumen tingkat satu.","Katak, ayam, burung pemakan serangga","terbit"',
        '"Dekomposer","Rantai Makanan","Organisme pengurai yang memecah materi organik makhluk hidup mati menjadi zat hara tanah.","Jamur, bakteri pembusuk, cacing tanah","terbit"',
        '"Habitat","Ekosistem","Tempat hidup alami tempat bertumbuh dan berkembang biaknya suatu populasi makhluk hidup.","Hutan hujan tropis, sawah, terumbu karang","terbit"',
        '"Simbiosis Mutualisme","Saling Bergantung","Bentuk interaksi antara dua organisme berbeda spesies yang saling menguntungkan kedua belah pihak.","Lebah dengan bunga, burung jalak dengan kerbau","terbit"'
      ].join('\n');

      const blob = new Blob(['\uFEFF' + templateContent], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Template_Impor_Kamus_IPAS_KUPAS.csv';
      a.click();
      umumkanAria('Berkas template CSV kamus berhasil diunduh.');
    });

    const btnImporKamus = document.getElementById('btn-impor-kamus');
    const inputImporKamus = document.getElementById('input-impor-kamus');

    if (btnImporKamus && inputImporKamus) {
      btnImporKamus.addEventListener('click', () => {
        inputImporKamus.value = '';
        inputImporKamus.click();
      });

      inputImporKamus.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        btnImporKamus.disabled = true;
        btnImporKamus.innerHTML = '<span>Mengimpor data kamus...</span>';

        try {
          let rows = [];
          if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
            const text = await file.text();
            rows = parseCSVKeObjekKamus(text);
          } else if (window.XLSX) {
            const buf = await file.arrayBuffer();
            const wb = window.XLSX.read(buf, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            rows = window.XLSX.utils.sheet_to_json(sheet);
          } else {
            throw new Error('Format berkas tidak didukung. Harap gunakan berkas CSV (.csv) atau Excel (.xlsx).');
          }

          if (!rows || rows.length === 0) {
            throw new Error('Berkas tidak memuat baris data yang dapat dibaca.');
          }

          const guru = await auth.ambilGuruAktif();
          const jml = await kamusManager.imporKamusMassal(guru?.id, rows);

          suara.mainkan('benar');
          umumkanAria(`${jml} istilah berhasil diimpor ke Kamus Belajar.`);
          alert(`Berhasil mengimpor ${jml} entri istilah ke Kamus Belajar IPAS!`);
          await muatKamus();
        } catch (err) {
          suara.mainkan('salah');
          alert('Gagal mengimpor berkas kamus: ' + err.message);
        } finally {
          btnImporKamus.disabled = false;
          btnImporKamus.innerHTML = `
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Impor Kamus (CSV / Excel)</span>
          `;
          inputImporKamus.value = '';
        }
      });
    }

    // Route Guard: Pastikan guru telah terotentikasi di Supabase
    const guruAktif = await auth.periksaAksesGuru();
    if (guruAktif) {
      muatKamus();
    }
  </script>
</body>
</html>
