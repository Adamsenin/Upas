<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Masuk & Daftar Guru - KUPAS KUIS IPAS Kelas V SD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/tema.css">
  <link rel="stylesheet" href="../assets/css/animasi.css">
  <link rel="stylesheet" href="../assets/css/komponen.css">
  <link rel="stylesheet" href="../assets/css/latar-hidup.css">
</head>
<body class="motion-full d-flex flex-column min-vh-100 justify-content-between" data-latar-tema="tenang">
  <!-- Navigasi Utama Aplikasi -->
  <header id="wadah-navbar"></header>

  <!-- Konten Utama: Portal Masuk & Daftar Guru -->
  <main class="container py-4 my-auto flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div id="kartu-auth" class="kupas-card anim-slide-up p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <img src="../assets/svg/maskot-senang.svg" alt="Maskot KUPAS" width="84" height="84" class="anim-melambai mb-2" id="maskot-auth">
            <span class="badge rounded-pill fw-bold px-3 py-1 mb-2 d-inline-flex align-items-center gap-1" style="background-color: #FEF3C7; color: #B45309; border: 2px solid var(--kupas-forest-dark);">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
              <span>Portal Pengajar Sains IPAS</span>
            </span>
            <h1 class="h3 fw-bolder mb-1" style="font-family: var(--font-heading); color: var(--kupas-forest-dark);">
              Ruang Guru KUPAS
            </h1>
            <p class="text-secondary small fw-semibold">Kelola kuis, pantau sesi kelas, dan cetak sertifikat siswa.</p>
          </div>

          <!-- Nav Tab Masuk / Daftar -->
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3 border border-2 border-dark" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-bold text-dark py-2" id="tab-masuk" data-bs-toggle="pill" data-bs-target="#panel-masuk" type="button" role="tab" aria-selected="true">Masuk</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-bold text-dark py-2" id="tab-daftar" data-bs-toggle="pill" data-bs-target="#panel-daftar" type="button" role="tab" aria-selected="false">Daftar Akun Baru</button>
            </li>
          </ul>

          <!-- Pesan Peringatan / Kesalahan -->
          <div id="alert-auth" class="alert alert-danger d-none border-2 border-dark fw-semibold" role="alert"></div>

          <div class="tab-content">
            <!-- Form Masuk -->
            <div class="tab-pane fade show active" id="panel-masuk" role="tabpanel">
              <form id="form-masuk" novalidate>
                <div class="mb-3">
                  <label for="email-masuk" class="form-label fw-bold small" style="color: var(--kupas-forest-dark);">Alamat Email Guru</label>
                  <input type="email" class="form-control form-control-lg border-2 border-dark" id="email-masuk" placeholder="nama@sekolah.sch.id" required autocomplete="email">
                </div>
                <div class="mb-4">
                  <label for="pass-masuk" class="form-label fw-bold small" style="color: var(--kupas-forest-dark);">Kata Sandi</label>
                  <input type="password" class="form-control form-control-lg border-2 border-dark" id="pass-masuk" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-cta-petualang w-100 py-3 fs-5 mb-2 smartboard-btn" id="btn-submit-masuk">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                  <span>Masuk ke Dasbor Guru</span>
                </button>
              </form>
            </div>

            <!-- Form Daftar -->
            <div class="tab-pane fade" id="panel-daftar" role="tabpanel">
              <form id="form-daftar" novalidate>
                <div class="mb-3">
                  <label for="nama-daftar" class="form-label fw-bold small" style="color: var(--kupas-forest-dark);">Nama Lengkap Guru</label>
                  <input type="text" class="form-control border-2 border-dark" id="nama-daftar" placeholder="Contoh: Ibu Siti Rahayu, S.Pd." required>
                </div>
                <div class="mb-3">
                  <label for="sekolah-daftar" class="form-label fw-bold small" style="color: var(--kupas-forest-dark);">Nama Sekolah</label>
                  <input type="text" class="form-control border-2 border-dark" id="sekolah-daftar" placeholder="Contoh: SD Negeri 1 Nusantara" required>
                </div>
                <div class="mb-3">
                  <label for="email-daftar" class="form-label fw-bold small" style="color: var(--kupas-forest-dark);">Alamat Email</label>
                  <input type="email" class="form-control border-2 border-dark" id="email-daftar" placeholder="nama@sekolah.sch.id" required autocomplete="email">
                </div>
                <div class="mb-4">
                  <label for="pass-daftar" class="form-label fw-bold small" style="color: var(--kupas-forest-dark);">Kata Sandi Baru</label>
                  <input type="password" class="form-control border-2 border-dark" id="pass-daftar" placeholder="Minimal 6 karakter" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-kupas-kuning w-100 py-3 fs-5 smartboard-btn fw-bold d-flex align-items-center justify-content-center gap-2" id="btn-submit-daftar">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                  <span>Buat Akun Guru Baru</span>
                </button>
              </form>
            </div>
          </div>

          <div class="text-center mt-4">
            <a href="../index.html" class="text-decoration-none fw-bold text-secondary d-inline-flex align-items-center gap-1">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              <span>Kembali ke Beranda</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Kaki Halaman Sederhana -->
  <footer class="text-center py-3 border-top border-2 border-dark" style="background-color: #F8F2E2;">
    <div class="container small fw-bold" style="color: var(--kupas-forest-dark);">
      KUPAS KUIS IPAS v4.0 &bull; Kurikulum Merdeka IPAS Kelas V SD &bull; Petualangan Ekosistem Nusantara
    </div>
  </footer>

  <!-- Script Dependensi Supabase & Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/latar-hidup.js"></script>

  <script type="module">
    import { auth } from '../assets/js/auth.js';
    import { pasangHeader, umumkanAria } from '../assets/js/ui.js';
    import { animasi } from '../assets/js/animasi.js';

    pasangHeader('guru', { berandaLink: '../index.html', rootAset: '../' });

    // Cek jika guru sudah masuk, langsung ke dasbor atau tujuan sebelumnya
    auth.ambilGuruAktif().then(user => {
      if (user) {
        const tujuan = sessionStorage.getItem('kupas_redirect_tujuan') || 'dasbor.html';
        sessionStorage.removeItem('kupas_redirect_tujuan');
        window.location.href = tujuan;
      }
    });

    const alertEl = document.getElementById('alert-auth');
    const kartuAuth = document.getElementById('kartu-auth');
    const maskotEl = document.getElementById('maskot-auth');

    function tampilkanError(pesan) {
      if (pesan && pesan.toLowerCase().includes('email not confirmed')) {
        alertEl.innerHTML = `<strong>Email belum dikonfirmasi!</strong><br>Supabase secara default mengaktifkan verifikasi email.<br>• Buka Inbox/Spam email Anda dan klik tautan verifikasi, atau<br>• Di Dashboard Supabase: buka menu <strong>Authentication &gt; Providers &gt; Email</strong> lalu matikan (uncheck) opsi <em>"Confirm email"</em> agar akun bisa langsung masuk.`;
      } else if (pesan && pesan.toLowerCase().includes('invalid login credentials')) {
        alertEl.textContent = 'Email atau kata sandi salah. Silakan periksa kembali.';
      } else {
        alertEl.textContent = pesan;
      }
      alertEl.classList.remove('d-none');
      maskotEl.src = '../assets/svg/maskot-bingung.svg';
      animasi.goyang(kartuAuth);
      umumkanAria('Kesalahan: ' + (alertEl.textContent || pesan));
    }

    // Tangani Masuk
    document.getElementById('form-masuk').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.classList.add('d-none');
      const email = document.getElementById('email-masuk').value.trim();
      const pass = document.getElementById('pass-masuk').value;

      if (!email || !pass) {
        tampilkanError('Harap isi alamat email dan kata sandi.');
        return;
      }

      const btn = document.getElementById('btn-submit-masuk');
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        await auth.masukGuru(email, pass);
        maskotEl.src = '../assets/svg/maskot-bersorak.svg';
        umumkanAria('Berhasil masuk! Mengalihkan ke dasbor...');
        setTimeout(() => {
          const tujuan = sessionStorage.getItem('kupas_redirect_tujuan') || 'dasbor.html';
          sessionStorage.removeItem('kupas_redirect_tujuan');
          window.location.href = tujuan;
        }, 400);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Masuk ke Dasbor Guru';
        tampilkanError(err.message || 'Gagal masuk. Periksa kembali email dan kata sandi.');
      }
    });

    // Tangani Pendaftaran
    document.getElementById('form-daftar').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.classList.add('d-none');
      const nama = document.getElementById('nama-daftar').value.trim();
      const sekolah = document.getElementById('sekolah-daftar').value.trim();
      const email = document.getElementById('email-daftar').value.trim();
      const pass = document.getElementById('pass-daftar').value;

      if (!nama || !sekolah || !email || !pass) {
        tampilkanError('Harap lengkapi semua isian pendaftaran.');
        return;
      }

      const btn = document.getElementById('btn-submit-daftar');
      btn.disabled = true;
      btn.textContent = 'Mendaftarkan...';

      try {
        const res = await auth.daftarGuru(email, pass, nama, sekolah);
        if (res?.session) {
          alertEl.className = 'alert alert-success border-2 border-dark fw-semibold';
          alertEl.textContent = 'Pendaftaran berhasil! Mengalihkan ke dasbor...';
          alertEl.classList.remove('d-none');
          maskotEl.src = '../assets/svg/maskot-senang.svg';
          setTimeout(() => {
            const tujuan = sessionStorage.getItem('kupas_redirect_tujuan') || 'dasbor.html';
            sessionStorage.removeItem('kupas_redirect_tujuan');
            window.location.href = tujuan;
          }, 800);
        } else {
          btn.disabled = false;
          btn.textContent = 'Buat Akun Guru Baru';
          alertEl.className = 'alert alert-warning border-2 border-dark fw-semibold';
          alertEl.innerHTML = `Akun berhasil dibuat! Namun Supabase mewajibkan verifikasi email.<br>• Silakan buka <strong>Inbox / Spam di ${email}</strong> untuk klik tautan konfirmasi, atau<br>• Di Dashboard Supabase: buka <em>Authentication &gt; Users</em> lalu klik <em>Confirm email</em> pada akun Anda.`;
          alertEl.classList.remove('d-none');
          maskotEl.src = '../assets/svg/maskot-berpikir.svg';
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Buat Akun Guru Baru';
        tampilkanError(err.message || 'Gagal mendaftar akun guru.');
      }
    });
  </script>
</body>
</html>
